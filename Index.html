<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Technology | Agendamento Online</title>
    <!-- Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-p-6">

    <div class="max-w-md mx-auto bg-slate-800 rounded-xl shadow-xl overflow-hidden md:max-w-xl my-10 border border-slate-700">
        <div class="p-6">
            <div class="text-center mb-6">
                <span class="text-xs font-semibold tracking-widest text-indigo-400 uppercase">AM Technology</span>
                <h1 class="text-2xl font-bold text-white mt-1">Agende o seu Horário</h1>
                <p class="text-sm text-slate-400 mt-1">Selecione o serviço e o profissional pretendido.</p>
            </div>

            <form id="bookingForm" class="space-y-4">
                <!-- Seleção de Serviço -->
                <div>
                    <label class="block text-sm font-medium text-slate-300">Serviço</label>
                    <select id="service" class="mt-1 block w-full rounded-md bg-slate-700 border-slate-600 text-white p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="corte">Corte de Cabelo (R$ 40,00 - 30 min)</option>
                        <option value="barba">Barba Completa (R$ 30,00 - 20 min)</option>
                        <option value="combo">Combo Corte + Barba (R$ 60,00 - 50 min)</option>
                        <option value="massagem">Massagem Relaxante (R$ 90,00 - 60 min)</option>
                    </select>
                </div>

                <!-- Seleção de Profissional (Sub-agendas) -->
                <div>
                    <label class="block text-sm font-medium text-slate-300">Profissional</label>
                    <select id="professional" class="mt-1 block w-full rounded-md bg-slate-700 border-slate-600 text-white p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="bellan">Bellan (Barbeiro)</option>
                        <option value="joao">João (Barbeiro)</option>
                        <option value="ana">Ana (Especialista em Massagem)</option>
                    </select>
                </div>

                <!-- Data e Hora -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Data</label>
                        <input type="date" id="date" class="mt-1 block w-full rounded-md bg-slate-700 border-slate-600 text-white p-2 focus:ring-indigo-500 focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300">Horário</label>
                        <select id="time" class="mt-1 block w-full rounded-md bg-slate-700 border-slate-600 text-white p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                        </select>
                    </div>
                </div>

                <!-- Dados do Cliente -->
                <div>
                    <label class="block text-sm font-medium text-slate-300">O seu Nome</label>
                    <input type="text" id="clientName" placeholder="Ex: Carlos Silva" required class="mt-1 block w-full rounded-md bg-slate-700 border-slate-600 text-white p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300">O seu Telemóvel (WhatsApp)</label>
                    <input type="tel" id="clientPhone" placeholder="(11) 99999-9999" required class="mt-1 block w-full rounded-md bg-slate-700 border-slate-600 text-white p-2.5 focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <!-- Botão de Ação -->
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-md transition duration-200 mt-4 shadow-lg">
                    Confirmar Agendamento
                </button>
            </form>
        </div>
    </div>

</body>
</html>
